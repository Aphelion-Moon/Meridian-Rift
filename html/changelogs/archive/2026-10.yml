  - code_imp: Cleanup exercise code `null` value
  - rscadd: Add toxic and radioactive effects to breathing Antinoblium.
  - balance: Breathing harmful gases causes lung damage. (scales with partial pressure)
  - balance: Plasmamen breathing oxygen now causes TOXIN damage.
  - bugfix: Fix wound chance for legs from falling z-levels decreasing the more z-levels
      you fall down
  tontyGH:
  - refactor: 'A lot of code relating to hands was altered for technical reasons,
      which fixed these issues:'
  - bugfix: Sleeping Carp's style malus did not ignore "cool" held items
  - bugfix: Cursed blade could not be used to bind haunted longsword
  - bugfix: Amber focus could not be used to bind haunted longsword
  - bugfix: Items that could block did not correctly block push/shuffle attempts
  - bugfix: The swap_hands tutorial did not account for 3+ hands
  - bugfix: High-tenning a mob did not account for more than 2 hands (you can high-twenty
