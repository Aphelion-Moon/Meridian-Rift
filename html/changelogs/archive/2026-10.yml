  - code_imp: Biting can no longer overfeed you.
  - code_imp: You do not lick people as a felinid if you have combat mode on.
  the-orange-cow:
  - rscadd: New fertilizer at your local biogenerator, Chemo Cultivate. Reduces weeds,
