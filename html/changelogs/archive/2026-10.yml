2026-10-05:
  vinylspiders:
  - rscadd: adds the ability to paint custom hairstyle and markings in character creator
  - rscadd: barber update - you can now give custom haircuts to players and they can
      choose to keep it permanently or just for the round, hair trimmings actually
      look like your hair now, and more
  - rscadd: adds a tattoo gun - you can find it in the barber's locker and barbervend,
      this item lets you paint custom markings on yourself or other players
  - bugfix: fixes a bug where ai or silicon job prefs makes your char preview not
      render correctly
2026-10-08:
