author: "Meridian Rift"
delete-after: True
changes:
  - rscadd: "NT Banking provides current and offshore accounts with automatic settlement, bank statements, and in-world account terms."
  - balance: "Saved regular funds share the payroll and card balance. Eligible income settles automatically; starting pay and excess income remain shift credit."
  - admin: "A red reset control can clear everyone's persistent savings with a reason and explicit confirmation."
  - balance: "Persistent income has a shared per-player round cap, deposit fee, savings ceiling, and active-round wealth levy."
  - admin: "Manage Persistent Economy provides account adjustments, freezes, monetary policy controls, and audit histories."
  - admin: "The economy panel now shows recent round transactions per account and allows logged department budget adjustments."
  - bugfix: "Policy saves preserve transaction history arrays; startup repairs affected histories without reverting current balances or policy."
  - bugfix: "The savings transaction cooldown no longer interrupts player panel updates."
