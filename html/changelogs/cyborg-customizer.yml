author: "Meridian-Rift contributors, SPLURT contributors"
delete-after: true
changes:
  - rscadd: "Character setup has a dedicated cyborg appearance and lore page with layout presets and per-model defaults."
  - rscadd: "Cyborgs can control part visibility and arousal through compact RoboTact and interaction panels. Configuration stays in Setup Character; viewer display remains independent."
  - qol: "The Cyborg creator has a model gallery, separate sprite-size and 25–200% scale controls, direct part dragging, and individual confirmed resets in a larger three-column layout."
  - bugfix: "Cyborg sliders and color controls wait for a pause before updating the preview, pixel placement rounds to whole numbers, and camera dragging no longer selects preview contents. Presets and defaults have clearer grouping and hover help."
  - qol: "Cyborg previews include Syndicate and Ninja skins, manual gallery rotation, a size-reference mannequin, and a movement toggle beside the direction controls. Wide chassis support mirrored placement and optional south artwork in north-facing views."
  - bugfix: "Cyborg preview rotation preserves camera framing and 1:1 body scale; selecting or moving parts preserves their layer order. Closed model galleries no longer generate thumbnails during edits."
  - bugfix: "Wide cyborgs have independent north, south, and east/west placement. Newly saved presets and model defaults include selected parts, which activate on a new body."
  - qol: "Cyborg profile portraits have sidebar previews, model gallery controls and labels align, and runtime controls explain hidden viewer settings."
  - bugfix: "Cyborg parts and body masks inherit chassis offsets and scaling once, with the same centered placement as the preview. Creator edits no longer reconfigure an existing body."
  - qol: "Cyborg presets restore their chassis and can be assigned by name as its spawn appearance. Shared Syndicate/Ninja galleries are consolidated; profile and appearance sidebars match."
  - bugfix: "Live cyborg parts render beneath their chassis masks, and wide cyborg inspect portraits are centered and fitted to the preview."
  - qol: "Cyborg profiles use SFW/NSFW Flavor Text labels and separate SFW/NSFW OOC notes. Empty notes fall back to the matching human notes, with placeholder guidance inside both fields."
  - qol: "Cyborg Appearance buttons and numeric controls align consistently, reset confirmations keep their positions, compact Identity panels have more space, and part-dragging help reflects the current view."
  - bugfix: "Cyborg visual placement and sliders edit the same selected pose or arousal state. Standing edits no longer affect other poses, and manual placement pauses preview animation."
  - qol: "The Cyborg editor uses shared, pose, and arousal placement tabs, aligned part-size controls, sidebar saving status, and SFW/NSFW headshot labels."
  - bugfix: "Cyborg preview 1:1 measures the current game map zoom and accounts for display scaling while preserving body size."
  - bugfix: "Cyborg part placement and animation use screen offsets so cosmetic positioning does not change map depth ordering."
