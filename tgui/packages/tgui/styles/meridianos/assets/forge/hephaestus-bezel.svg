<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Original stationary twelve-tooth gear housing and recessed instrument track. -->
  <defs>
    <linearGradient id="bronze" x1="18" y1="5" x2="179" y2="181" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c6b184"/><stop offset=".19" stop-color="#a28a5e"/>
      <stop offset=".53" stop-color="#5f553c"/><stop offset=".77" stop-color="#91815b"/>
      <stop offset="1" stop-color="#3b3527"/>
    </linearGradient>
    <radialGradient id="steel"><stop stop-color="#253334"/><stop offset="1" stop-color="#111b20"/></radialGradient>
    <pattern id="casting" width="19" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r=".9" fill="#111810" fill-opacity=".3"/>
      <path d="M3 4h2m9 5h1" stroke="#e4d2ac" stroke-opacity=".21"/>
    </pattern>
    <g id="tooth">
      <path d="m91 2 18 0 2 3-1 20H90L89 5Z" fill="url(#bronze)" stroke="#161913" stroke-width="1.7"/>
      <path d="M92 5h15m-15 0-1 17" fill="none" stroke="#d3c39c" stroke-width="1"/>
      <path d="m96 6-1 14" stroke="#514931" stroke-width="1"/>
    </g>
    <g id="joint">
      <path d="M96 16h8v12h-8Z" fill="#625942" stroke="#1c211a" stroke-width="1"/>
      <circle cx="100" cy="22" r="2" fill="#302f22" stroke="#c1ad7c" stroke-width=".65"/>
    </g>
  </defs>
  <g>
    <use href="#tooth"/><use href="#tooth" transform="rotate(30 100 100)"/>
    <use href="#tooth" transform="rotate(60 100 100)"/><use href="#tooth" transform="rotate(90 100 100)"/>
    <use href="#tooth" transform="rotate(120 100 100)"/><use href="#tooth" transform="rotate(150 100 100)"/>
    <use href="#tooth" transform="rotate(180 100 100)"/><use href="#tooth" transform="rotate(210 100 100)"/>
    <use href="#tooth" transform="rotate(240 100 100)"/><use href="#tooth" transform="rotate(270 100 100)"/>
    <use href="#tooth" transform="rotate(300 100 100)"/><use href="#tooth" transform="rotate(330 100 100)"/>
  </g>
  <circle cx="100" cy="100" r="86" fill="url(#bronze)" stroke="#c8b58a" stroke-width="1.1"/>
  <circle cx="100" cy="100" r="84" fill="url(#casting)"/>
  <circle cx="100" cy="100" r="78" fill="url(#steel)" stroke="#292b21" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="#c0aa77" stroke-width=".8"/>
  <circle cx="100" cy="100" r="67" fill="none" stroke="#6c6246" stroke-width="1"/>
  <circle cx="100" cy="100" r="62" fill="#101819" stroke="#9a8962" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="59.5" fill="none" stroke="#3f473b" stroke-width="2"/>
  <use href="#joint"/><use href="#joint" transform="rotate(90 100 100)"/>
  <use href="#joint" transform="rotate(180 100 100)"/><use href="#joint" transform="rotate(270 100 100)"/>
</svg>
