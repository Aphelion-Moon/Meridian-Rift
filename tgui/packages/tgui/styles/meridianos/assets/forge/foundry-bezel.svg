<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Original stationary cast-bronze housing, twelve marks and engraved tracks. -->
  <defs>
    <linearGradient id="bronze" x1="20" y1="10" x2="169" y2="194" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cfaa6b"/><stop offset=".17" stop-color="#997240"/>
      <stop offset=".48" stop-color="#634624"/><stop offset=".76" stop-color="#846038"/>
      <stop offset="1" stop-color="#302113"/>
    </linearGradient>
    <radialGradient id="recess"><stop stop-color="#352416"/><stop offset="1" stop-color="#171009"/></radialGradient>
    <pattern id="casting" width="13" height="17" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r=".8" fill="#0d0905" fill-opacity=".35"/>
      <path d="M3 3h1m4 9h1m3-6h1" stroke="#e4bc7c" stroke-opacity=".26"/>
    </pattern>
    <path id="tick" d="M98.5 14h3v9h-3Z"/>
    <g id="fastener">
      <circle cx="100" cy="6.8" r="2.3" fill="#362415" stroke="#c9a267" stroke-width=".7"/>
      <path d="m98.8 7.9 2.4-2.3" stroke="#0f0a05" stroke-width="1"/>
    </g>
  </defs>
  <circle cx="100" cy="100" r="98" fill="#100b06"/>
  <circle cx="100" cy="100" r="95.5" fill="url(#bronze)" stroke="#ddbd84" stroke-width="1"/>
  <circle cx="100" cy="100" r="94" fill="url(#casting)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#1f150c" stroke-width="2.4"/>
  <circle cx="100" cy="100" r="87.5" fill="url(#recess)" stroke="#bb955c" stroke-width=".8"/>
  <g fill="#b7945c" stroke="#422b14" stroke-width=".6">
    <use href="#tick"/><use href="#tick" transform="rotate(30 100 100)"/>
    <use href="#tick" transform="rotate(60 100 100)"/><use href="#tick" transform="rotate(90 100 100)"/>
    <use href="#tick" transform="rotate(120 100 100)"/><use href="#tick" transform="rotate(150 100 100)"/>
    <use href="#tick" transform="rotate(180 100 100)"/><use href="#tick" transform="rotate(210 100 100)"/>
    <use href="#tick" transform="rotate(240 100 100)"/><use href="#tick" transform="rotate(270 100 100)"/>
    <use href="#tick" transform="rotate(300 100 100)"/><use href="#tick" transform="rotate(330 100 100)"/>
  </g>
  <circle cx="100" cy="100" r="75.5" fill="none" stroke="#a47e47" stroke-width=".8"/>
  <circle cx="100" cy="100" r="67" fill="none" stroke="#73502b" stroke-width="1"/>
  <circle cx="100" cy="100" r="62" fill="#0e0a06" stroke="#b58d50" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="59.5" fill="none" stroke="#422d18" stroke-width="2"/>
  <use href="#fastener" transform="rotate(15 100 100)"/>
  <use href="#fastener" transform="rotate(135 100 100)"/>
  <use href="#fastener" transform="rotate(255 100 100)"/>
</svg>
