[package]
name = "meridian_painting_store"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
atomicwrites = "=0.4.4"
fs2 = "=0.4.3"
png = "=0.17.16"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.143", features = ["preserve_order"] }
sha2 = "=0.10.9"
same-file = "=1.0.6"

[dev-dependencies]
tempfile = "=3.21.0"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
