on:
  workflow_call:
    inputs:
      major:
        required: true
        type: string
      minor:
        required: true
        type: string

jobs:
  setup_build_artifact:
    name: Setup build artifact (${{ format('{0}.{1}', inputs.major, inputs.minor) }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6 # APHELION EDIT CHANGE - ORIGINAL: timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: ./.github/actions/setup_bun
      - name: Restore BYOND from Cache
        uses: ./.github/actions/restore_or_install_byond
        with:
          major: ${{ inputs.major }}
          minor: ${{ inputs.minor }}
      # APHELION EDIT ADDITION START - Package the painting library with runtime test artifacts.
      - name: Build painting-store runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-multilib libc6-dev-i386
          rustup toolchain install 1.89.0 --profile minimal --target i686-unknown-linux-gnu
          bash tools/painting_store/build.sh
      # APHELION EDIT ADDITION END
      - name: Compile
        run: |
          source $HOME/BYOND/byond/bin/byondsetup
          tools/build/build.sh --ci dm -DCIBUILDING -DANSICOLORS -Werror -ITG0001 -I"loop_checks"
      - name: Setup variable for output path
        run: |
          OUTPUT_DIR="target"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV
      - name: Copy output files
        run: |
          bash tools/ci/copy_build_output.sh $OUTPUT_DIR
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact-${{ inputs.major }}-${{ inputs.minor }}
          path: ${{ env.OUTPUT_DIR }}
          retention-days: 1
